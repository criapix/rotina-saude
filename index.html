<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rotina de Saúde</title>
  <meta name="description" content="Treino, nutrição, ciclismo e acompanhamento clínico.">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app/styles.css">
</head>
<body>
  <!--
    O shell (cabeçalho, navegação, rodapé) é público e renderiza sem senha.
    Só o conteúdo dos documentos é cifrado — a senha libera os dados, não a interface.
  -->
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

  <header class="topbar" id="topbar">
    <button class="topbar-brand" id="btn-brand" type="button" aria-label="Ir para Hoje">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h3.5l2-5 3.5 10 2.5-5H21"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Rotina de Saúde</strong>
        <small id="brand-sub">Painel pessoal</small>
      </span>
    </button>

    <div class="topbar-actions">
      <button class="icon-btn" id="btn-busca" type="button" aria-label="Buscar" title="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-tema" type="button" aria-label="Alternar tema" title="Alternar tema">
        <svg class="ic-tema-claro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        <svg class="ic-tema-escuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Mais seções" title="Mais seções">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Seções"></nav>
    <main class="content" id="conteudo" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Mais seções"></div>

  <div class="toast" id="toast" hidden></div>

  <noscript>
    <p style="padding:2rem;text-align:center">Este app precisa de JavaScript para decifrar e montar os dados.</p>
  </noscript>

  <script type="module" src="app/main.js"></script>
</body>
</html>
